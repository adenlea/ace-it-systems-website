kind = "web"
previewPath = "/"
title = "ACE IT Systems Website"
version = "1.0.0"
id = "artifacts/ace-it-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19456

[services.development]
run = "pnpm --filter @workspace/ace-it-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ace-it-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/ace-it-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19456"
BASE_PATH = "/"
